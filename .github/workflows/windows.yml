name: Windows build and tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: PowerShell 5.1 regression tests
        shell: powershell
        run: |
          ./tests/test-lid-vibe.ps1
          ./tests/test-lid-vibe-auto.ps1
          ./tests/test-lid-vibe-design.ps1
          ./tests/test-media.ps1
          ./tests/test-volume.ps1
          ./tests/test-fix.ps1
      - name: PowerShell 7 regression tests
        shell: pwsh
        run: |
          ./tests/test-lid-vibe.ps1
          ./tests/test-lid-vibe-auto.ps1
          ./tests/test-lid-vibe-design.ps1
          ./tests/test-media.ps1
          ./tests/test-volume.ps1
          ./tests/test-fix.ps1
      - name: Build and test executable
        shell: powershell
        run: ./build.ps1 -Test
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: LV-01-windows-x64
          path: dist/*
          if-no-files-found: error
